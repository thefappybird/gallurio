# Production Compose definition. Keep this file on the VPS alongside a small
# deployment-only `.env` containing GALLURIO_IMAGE, never application secrets.
# Application secrets stay in /etc/gallurio/gallurio.env, outside the repository.
services:
  gallurio:
    image: ${GALLURIO_IMAGE:?Set GALLURIO_IMAGE to an immutable GHCR image tag or digest}
    restart: unless-stopped
    env_file:
      - ${GALLURIO_ENV_FILE:-/etc/gallurio/gallurio.env}
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    init: true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health?ready=1').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
