services:
  workflow-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gallurio_workflow}
      POSTGRES_USER: ${POSTGRES_USER:-gallurio_workflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - workflow-postgres-data:/var/lib/postgresql/data
    ports:
      # Host-only during this preparation phase. The future Gallurio app
      # container should join this Compose project and use the service name.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  workflow-postgres-data:
    name: gallurio-workflow-postgres-data
